# Docker Build and Push workflow (for automatically updating the latest docker container)
name: Docker Build and Push

# Runs whenever there is a push or PR to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Log in to Docker Hub (use secrets for security)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # These secrets are set in the GitHub repository settings
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set up Docker Buildx (for advanced features like caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile
          push: true # Set to true to push to Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/fragments:latest

      - name: Log out from Docker Hub
        run: docker logout
