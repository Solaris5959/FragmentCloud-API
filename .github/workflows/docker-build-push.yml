name: Docker Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Log in to Docker Hub (use secrets for security)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Set up Docker Buildx (for advanced features like caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile # Path to your Dockerfile, adjust if needed
          push: true # Set to true to push to Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/solaris595-fragments:latest # Tag with your Docker username and repository

      # Optionally, you can also add a step to log out from Docker Hub after the operation
      - name: Log out from Docker Hub
        run: docker logout
